name: Setup and build
description: >-
  Internal helper for this repo's workflows: install node/pnpm/just and build
  the action bundle (dist/index.js is not committed).

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - uses: pnpm/action-setup@v4
      with:
        version: latest
    - uses: extractions/setup-just@v2
    - name: Build action
      run: just build
      shell: bash
