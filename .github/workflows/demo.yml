name: Demo

# Fakes a set of profiling runs against this repo's REAL wiki (storage mode
# 'auto' resolves to it now that it exists), exercising every state the
# framework renders:
#
#   fib/O0     in-flight -> done 812.4
#   fib/O1     in-flight -> (4 min "benchmark") -> done 401.7   <- watch the live page flip
#   fib/O2     in-flight -> done 213.9
#   fib/O3     done with epoch override 2 (< config epoch 3)    -> STALE (struck through)
#   matmul/O0  in-flight -> job ends without reporting          -> ABORTED (post step)
#   matmul/O1  in-flight -> explicit "failed" report with note  -> FAILED
#   matmul/O2  never touched                                    -> stays empty
#   matmul/O3  in-flight backdated 2h, post guard off           -> LOST (TTL 60 min)
#
# `prepare` builds the action bundle once and shares it as an artifact, and
# every reporter job then waits for a common clock boundary before its first
# write: real profiling fan-outs are dozens of jobs wide, so collisions on the
# results branch are routine -- this 7-job demo lines its writes up to hit the
# same window reliably. Expect "push rejected ... will re-fetch and re-apply"
# retry lines in these logs: that is the concurrency loop working as designed.
#
# Live page: https://github.com/wow-look-at-my/profiling-results-matrix/wiki/Profiling-Results

on:
  workflow_dispatch:
    inputs:
      reset:
        description: 'Wipe all recorded demo cells first (clean slate)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/upload-artifact@v4
        with:
          name: action-dist
          path: dist/
      - name: Reset matrix data
        if: inputs.reset
        uses: ./
        with:
          status: reset

  fib-O0:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: action-dist
          path: dist
      - name: Line up on a clock boundary (reliably collide the first writes)
        run: sleep $(( 90 - $(date +%s) % 90 ))
      - name: Start profiling fib/O0
        uses: ./
        with:
          cell: fib/O0
          status: in-flight
      - name: Benchmark (pretend)
        run: sleep 20
      - name: Report result
        uses: ./
        with:
          cell: fib/O0
          status: done
          value: '812.4'

  fib-O1-long-runner:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: action-dist
          path: dist
      - name: Line up on a clock boundary (reliably collide the first writes)
        run: sleep $(( 90 - $(date +%s) % 90 ))
      - name: Start profiling fib/O1
        uses: ./
        with:
          cell: fib/O1
          status: in-flight
      # Long enough for a human to watch the live page show "in flight" and
      # then flip to the measured value -- incremental updates, no batching.
      - name: Benchmark (pretend, slow)
        run: sleep 240
      - name: Report result
        uses: ./
        with:
          cell: fib/O1
          status: done
          value: '401.7'

  fib-O2:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: action-dist
          path: dist
      - name: Line up on a clock boundary (reliably collide the first writes)
        run: sleep $(( 90 - $(date +%s) % 90 ))
      - name: Start profiling fib/O2
        uses: ./
        with:
          cell: fib/O2
          status: in-flight
      - name: Benchmark (pretend)
        run: sleep 30
      - name: Report result
        uses: ./
        with:
          cell: fib/O2
          status: done
          value: '213.9'

  fib-O3-stale:
    name: "fib-O3: result from an older epoch (renders stale)"
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: action-dist
          path: dist
      # A result measured against epoch 2 while the config is at epoch 3:
      # it records fine but renders struck through until re-measured.
      - name: Line up on a clock boundary (reliably collide the first writes)
        run: sleep $(( 90 - $(date +%s) % 90 ))
      - name: Report backfilled result from epoch 2
        uses: ./
        with:
          cell: fib/O3
          status: done
          value: '95.0'
          epoch: '2'

  matmul-O0-never-reports:
    name: "matmul-O0: ends without reporting (post step records aborted)"
    needs: prepare
    runs-on: ubuntu-latest
    # This job never sends a done/failed report: the action's post step runs
    # at job end (post-if: always(), so on success, failure or cancellation
    # alike), notices the cell is still in-flight from this very run, and
    # records aborted. Exiting cleanly keeps every check run green -- the
    # repo's required aggregate `all-builds` status counts each job on the
    # SHA, so an intentionally red job would fail it. (The case where even
    # the post step never runs -- a hard-died runner -- is the TTL/lost cell,
    # matmul/O3 below.)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: action-dist
          path: dist
      - name: Line up on a clock boundary (reliably collide the first writes)
        run: sleep $(( 90 - $(date +%s) % 90 ))
      - name: Start profiling matmul/O0
        uses: ./
        with:
          cell: matmul/O0
          status: in-flight
      - name: Benchmark ends without ever reporting (intentional)
        run: echo "Ending cleanly with no done/failed report -- the post step must mark matmul/O0 aborted."

  matmul-O1-failed:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: action-dist
          path: dist
      - name: Line up on a clock boundary (reliably collide the first writes)
        run: sleep $(( 90 - $(date +%s) % 90 ))
      - name: Start profiling matmul/O1
        uses: ./
        with:
          cell: matmul/O1
          status: in-flight
      - name: Benchmark (pretend)
        run: sleep 15
      - name: Report explicit failure
        uses: ./
        with:
          cell: matmul/O1
          status: failed
          note: 'benchmark segfaulted'

  # matmul/O2 is deliberately never touched: it must stay rendered as "—".

  matmul-O3-lost:
    name: "matmul-O3: in-flight past TTL (renders lost)"
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: action-dist
          path: dist
      - name: Compute a start timestamp 2 hours in the past
        id: past
        run: echo "ts=$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # Backdated in-flight with the post guard disabled: nothing ever reports
      # this cell, so it stays in-flight and renders as "lost" (TTL 60 min).
      # This emulates a runner that hard-died before even the post step ran.
      - name: Line up on a clock boundary (reliably collide the first writes)
        run: sleep $(( 90 - $(date +%s) % 90 ))
      - name: Start profiling matmul/O3 (backdated, guard off)
        uses: ./
        with:
          cell: matmul/O3
          status: in-flight
          started-at: ${{ steps.past.outputs.ts }}
          post-guard: 'false'
