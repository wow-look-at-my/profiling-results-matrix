name: pr-open

# TEMPORARY: the session PAT driving this branch cannot create pull requests
# (fine-grained PAT without "Pull requests: write") and cannot dispatch
# workflows, so this on-push workflow opens the branch's draft PR once with
# GITHUB_TOKEN. Idempotent: exits quietly when the PR already exists. Deleted
# (together with .github/pr-body.md) before the branch is finished.

on:
  push:
    branches: [claude/profiling-results-matrix]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open draft PR if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing=$(gh pr list -R "$GITHUB_REPOSITORY" --head "${GITHUB_REF_NAME}" --state all --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "PR already exists; nothing to do"
            exit 0
          fi
          gh pr create --draft \
            -R "$GITHUB_REPOSITORY" \
            --head "${GITHUB_REF_NAME}" \
            --title "Profiling results matrix: self-updating incremental results table (action + demo)" \
            --body-file .github/pr-body.md
