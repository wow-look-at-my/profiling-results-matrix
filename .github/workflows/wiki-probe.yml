name: wiki-probe

# TEMPORARY probe: verifies that GITHUB_TOKEN (contents: write) can create and
# push this repo's wiki git repository from a workflow run. The wiki is the
# storage backend for the profiling-results-matrix action; a session PAT cannot
# push to wikis (fine-grained PAT limitation), so this must be proven from a
# real Actions run. This file is deleted once the real action's demo run has
# proven the same path end-to-end.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe wiki push with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          dir="$RUNNER_TEMP/wiki-probe"
          rm -rf "$dir"
          if git clone "$url" "$dir"; then
            echo "PROBE: wiki repo exists and is cloneable"
            cd "$dir"
            if [ -f Home.md ]; then
              echo "PROBE: wiki already bootstrapped; push capability proven by an earlier run. Nothing to do."
              exit 0
            fi
          else
            echo "PROBE: clone failed; wiki repo does not exist yet. Bootstrapping."
            mkdir -p "$dir"
            cd "$dir"
            git init -b master
            git remote add origin "$url"
          fi
          git config user.name "profiling-results-matrix[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          {
            echo '<!-- profiling-results-matrix home -->'
            echo '# Profiling results'
            echo
            echo 'Bootstrap page - auto-generated profiling results will replace this.'
          } > Home.md
          git add Home.md
          git commit -m "wiki probe: bootstrap Home.md"
          git push origin HEAD:master
          echo "PROBE: WIKI PUSH OK"
